AWSTemplateFormatVersion: '2010-09-09'
Description: Deploy the student Streamlit stock analysis app to a public EC2 instance in us-east-1.

Parameters:
  AppRepository:
    Type: String
    Default: https://github.com/gouhongyu-harrison/smu-cce-starter.git
    Description: Public HTTPS Git repository containing src/app.py and requirements.txt.
    AllowedPattern: '^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(\.git)?$'
    ConstraintDescription: Enter a public GitHub HTTPS repository URL.

Rules:
  RequireUsEast1:
    Assertions:
      - Assert: !Equals [!Ref AWS::Region, us-east-1]
        AssertDescription: Deploy this template in us-east-1 because the AMI is region-specific.

Resources:
  # Create an isolated network and allow DNS lookups for instances in the VPC.
  StudentVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-vpc'

  # Connect the VPC to the public internet.
  StudentInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-igw'

  # Gateway attachments do not support Tags in CloudFormation.
  VPCInternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref StudentInternetGateway
      VpcId: !Ref StudentVPC

  # Place the instance in a public subnet that automatically receives a public IP.
  StudentPublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref StudentVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-subnet'

  # Route internet-bound subnet traffic through the Internet Gateway.
  StudentPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref StudentVPC
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-routes'

  # Route and subnet association resources do not support Tags in CloudFormation.
  PublicInternetRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCInternetGatewayAttachment
    Properties:
      RouteTableId: !Ref StudentPublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref StudentInternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref StudentPublicRouteTable
      SubnetId: !Ref StudentPublicSubnet

  # Expose the Streamlit app to browsers over HTTP on port 8501.
  StudentInstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow browser access to the Streamlit web app.
      VpcId: !Ref StudentVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8501
          ToPort: 8501
          CidrIp: 0.0.0.0/0
          Description: Streamlit web application.
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-instance-sg'

  # Launch the requested small instance in the public subnet.
  StudentEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-0fef201115eefe936
      InstanceType: t2.micro
      SubnetId: !Ref StudentPublicSubnet
      SecurityGroupIds:
        - !GetAtt StudentInstanceSecurityGroup.GroupId
      UserData:
        Fn::Base64:
          Fn::Sub: |
            #!/bin/bash
            set -euxo pipefail

            if command -v dnf >/dev/null 2>&1; then
              dnf install -y git python3 python3-pip
            elif command -v yum >/dev/null 2>&1; then
              yum install -y git python3 python3-pip
            elif command -v apt-get >/dev/null 2>&1; then
              apt-get update -y
              DEBIAN_FRONTEND=noninteractive apt-get install -y git python3 python3-pip python3-venv
            else
              echo "No supported package manager found" >&2
              exit 1
            fi

            mkdir -p /opt/stock-analysis
            git clone --depth 1 '${AppRepository}' /opt/stock-analysis/app
            python3 -m venv /opt/stock-analysis/venv
            /opt/stock-analysis/venv/bin/python -m pip install --upgrade pip
            /opt/stock-analysis/venv/bin/python -m pip install -r /opt/stock-analysis/app/requirements.txt

            APP_USER=ec2-user
            if id ubuntu >/dev/null 2>&1; then
              APP_USER=ubuntu
            fi
            chown -R "$APP_USER:$APP_USER" /opt/stock-analysis

            cat > /etc/systemd/system/stock-analysis.service <<EOF
            [Unit]
            Description=Streamlit stock analysis app
            After=network-online.target
            Wants=network-online.target

            [Service]
            Type=simple
            User=$APP_USER
            WorkingDirectory=/opt/stock-analysis/app
            ExecStart=/opt/stock-analysis/venv/bin/streamlit run src/app.py --server.address 0.0.0.0 --server.port 8501
            Restart=on-failure
            RestartSec=5

            [Install]
            WantedBy=multi-user.target
            EOF

            systemctl daemon-reload
            systemctl enable --now stock-analysis.service
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-instance'

Outputs:
  ApplicationURL:
    Description: Open this URL after the instance finishes installing the app.
    Value: !Sub 'http://${StudentEC2Instance.PublicDnsName}:8501'
  InstancePublicIP:
    Description: Public IPv4 address of the EC2 instance.
    Value: !GetAtt StudentEC2Instance.PublicIp
  InstancePublicDNS:
    Description: Public DNS name of the EC2 instance.
    Value: !GetAtt StudentEC2Instance.PublicDnsName